blank_issues_enabled: false
contact_links:
  - name: Chat with the community
    url: https://www.homeaccounting.com/community
    about: Discord — #general, #self-hosting, #bank-providers, #showcase. Good for anything conversational.
  - name: Question, idea, or bank-provider request
    url: https://github.com/homeaccounting/backend/discussions
    about: Discussions are the place for questions, ideas, and requests for a new bank provider. Issues are for confirmed bugs and agreed work.
  - name: Security vulnerability
    url: https://github.com/homeaccounting/backend/security/advisories/new
    about: Never report a security problem in a public issue. Use private vulnerability reporting, or email security@homeaccounting.com.
  - name: Web UI bug
    url: https://github.com/homeaccounting/web/issues/new/choose
    about: Something wrong in the interface rather than the API? Report it on the web repository.
