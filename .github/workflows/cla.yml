name: CLA

# Contributor Licence Agreement check (tracker#9). No external PR may merge
# without a recorded signature — this preserves the project's relicensing
# optionality (business model §2).
#
# SECURITY NOTE on `pull_request_target`: this trigger runs with a token that
# can write to this repository, which is why the launch plan (§3b) flags it as
# a fork-PR hazard. It is safe *here* because this workflow never checks out
# or executes any code from the pull request — it only reads the PR metadata
# and writes a comment and a status. Do not add a checkout of the PR head, a
# build step, or anything that runs contributor-supplied code to this file.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signature
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check or record the CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on this repository only, used
          # to append to the signature store on the `cla-signatures` branch.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/homeaccounting/backend/blob/master/CLA.md
          custom-notsigned-prcomment: 'Thanks for the pull request. Before it can be merged we need a signed [Contributor Licence Agreement](https://github.com/homeaccounting/backend/blob/master/CLA.md) — you keep your copyright; it lets the project keep its licensing options open. Please read it and post the line below as a comment on this pull request:'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false
          allowlist: aleks-sidorenko,dependabot[bot],*[bot]
