name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: accounting
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.10.3"]
        cabal: ["3.10.3.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Temporarily hide cabal.project to avoid early cabal update
        run: |
          if [ -f accounting/cabal.project ]; then mv accounting/cabal.project accounting/cabal.project.bak; fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client libsqlite3-dev

      - name: Set up Haskell (GHC/Cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Cache Cabal store and dist-newstyle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            accounting/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ matrix.ghc }}-${{ hashFiles('**/package.yaml', 'accounting/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-${{ matrix.ghc }}-

      - name: Prepare cabal (ignore project) and install hpack
        run: |
          cabal update --ignore-project
          cabal install --ignore-project hpack

      - name: Generate .cabal file with hpack for accounting project
        run: |
          export PATH="$HOME/.cabal/bin:$PATH"          
          hpack

      - name: Restore cabal.project
        run: |
          if [ -f accounting/cabal.project.bak ]; then mv accounting/cabal.project.bak accounting/cabal.project; fi

      - name: Install hlint (ignore project)
        run: |
          cabal install --ignore-project hlint

      - name: Lint (hlint) - accounting project
        run: |
          export PATH="$HOME/.cabal/bin:$PATH"          
          hlint --version
          # Lint only tracked files to avoid build artifacts
          hlint --git

      - name: Build accounting project
        run: |
          cabal update
          cabal build all -j -fci

      - name: Wait for Postgres to be ready
        env:
          PGPASSWORD: password
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres... ($i)"
            sleep 2
          done

      # Note: Database schema is automatically created by eventium-postgresql
      # when tests initialize the event store via initializeEventStore.
      # No manual schema setup is required.

      - name: Run test suites
        run: |
          cabal test all -j -fci --test-show-details=direct --enable-tests

  # Built once per architecture on a native runner rather than one job with
  # QEMU: a Haskell build under emulation takes hours. Each job pushes an
  # untagged image by digest; publish-image assembles them into one manifest
  # list, so a `docker pull` resolves to the right architecture (tracker#75).
  build-image:
    name: Build Image (${{ matrix.platform }})
    needs: build-and-test
    if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Generate .cabal from package.yaml
        run: |
          curl -sSL https://github.com/sol/hpack/releases/download/0.38.3/hpack_linux.gz | gunzip > hpack
          chmod +x hpack
          ./hpack

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare
        id: prep
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "platform_slug=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_COMMIT_HASH=${{ steps.prep.outputs.sha_short }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/backend,push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform: a shared scope makes the two jobs evict each
          # other's layers on every run.
          cache-from: type=gha,scope=${{ steps.prep.outputs.platform_slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.platform_slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          # Filename is the bare hex; publish-image puts the sha256: back on.
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.prep.outputs.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish Multi-Arch Image
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SLUG="${BRANCH//\//-}"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          VERSION=$(grep '^version:' package.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: tags
        run: |
          SHA_TAG="ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.sha_short }}"
          BRANCH_TAG="ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.branch_slug }}"
          VERSION_TAG="ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.version }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "tags=${SHA_TAG},$BRANCH_TAG,$VERSION_TAG,ghcr.io/${{ github.repository_owner }}/backend:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${SHA_TAG},$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/backend"
          TAG_ARGS=$(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/--tag /' | tr '\n' ' ')
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $TAG_ARGS $(printf "${IMAGE}@sha256:%s " *)

      # The failure this guards against is silent: the stack stays pullable on
      # the runner's own architecture while being unusable everywhere else.
      - name: Verify both architectures are published
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.sha_short }}"
          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json
          for arch in amd64 arm64; do
            if ! jq -e --arg a "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a)' \
              manifest.json > /dev/null; then
              echo "::error::$IMAGE has no linux/$arch manifest"
              exit 1
            fi
          done
          echo "$IMAGE publishes linux/amd64 and linux/arm64"

  # Stable aggregate check named "CI" — the single required status check shared
  # across repos via the org ruleset (this repo's build job is matrix-named).
  ci:
    name: CI
    needs: [build-and-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require build-and-test to pass
        run: |
          echo "build-and-test: ${{ needs.build-and-test.result }}"
          test "${{ needs.build-and-test.result }}" = "success"
