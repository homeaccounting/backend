name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Build image and deploy'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: accounting
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.10.3"]
        cabal: ["3.10.3.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Temporarily hide cabal.project to avoid early cabal update
        run: |
          if [ -f accounting/cabal.project ]; then mv accounting/cabal.project accounting/cabal.project.bak; fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client libsqlite3-dev

      - name: Set up Haskell (GHC/Cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Cache Cabal store and dist-newstyle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            accounting/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ matrix.ghc }}-${{ hashFiles('**/package.yaml', 'accounting/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-${{ matrix.ghc }}-

      - name: Prepare cabal (ignore project) and install hpack
        run: |
          cabal update --ignore-project
          cabal install --ignore-project hpack

      - name: Generate .cabal file with hpack for accounting project
        run: |
          export PATH="$HOME/.cabal/bin:$PATH"          
          hpack

      - name: Restore cabal.project
        run: |
          if [ -f accounting/cabal.project.bak ]; then mv accounting/cabal.project.bak accounting/cabal.project; fi

      - name: Install hlint (ignore project)
        run: |
          cabal install --ignore-project hlint

      - name: Lint (hlint) - accounting project
        run: |
          export PATH="$HOME/.cabal/bin:$PATH"          
          hlint --version
          # Lint only tracked files to avoid build artifacts
          hlint --git

      - name: Build accounting project
        run: |          
          cabal update
          cabal build all -j

      - name: Wait for Postgres to be ready
        env:
          PGPASSWORD: password
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres... ($i)"
            sleep 2
          done

      # Note: Database schema is automatically created by eventium-postgresql
      # when tests initialize the event store via initializeEventStore.
      # No manual schema setup is required.

      - name: Run test suites
        run: |
          cabal test all -j --test-show-details=direct --enable-tests

  build-image:
    name: Build & Push Docker Image
    needs: build-and-test
    if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate .cabal from package.yaml
        run: |
          curl -sSL https://github.com/sol/hpack/releases/download/0.38.3/hpack_linux.gz | gunzip > hpack
          chmod +x hpack
          ./hpack

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SLUG="${BRANCH//\//-}"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          VERSION=$(grep '^version:' package.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: tags
        run: |
          SHA_TAG="ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.sha_short }}"
          BRANCH_TAG="ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.branch_slug }}"
          VERSION_TAG="ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.version }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "tags=${SHA_TAG},$BRANCH_TAG,$VERSION_TAG,ghcr.io/${{ github.repository_owner }}/backend:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${SHA_TAG},$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_COMMIT_HASH=${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-image
    runs-on: ubuntu-latest
    env:
      BACKEND_TAG: ${{ needs.build-image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy config
        run: source infra/deploy.env && echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV" && echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key_path: infra/deploy_key
          envs: BACKEND_TAG
          script: |
            cd /opt/backend
            sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=$BACKEND_TAG/" .env
            docker compose pull api
            docker compose up -d api
            docker image prune -f
