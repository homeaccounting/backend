#  Local Configuration for Accounting Backend
# Used for local developmen
environment: local

server:
  host: "127.0.0.1"
  port: 8080
  api_base_url: "${API_BASE_URL:-http://localhost:8080}"
  app_base_url: "${APP_BASE_URL:-http://localhost:5173}"

database:
  host: "${DB_HOST:-127.0.0.1}"
  port: "${DB_PORT:-5432}"
  user: "${DB_USER:-postgres}"
  password: "${DB_PASSWORD:-password}"
  database: "${DB_NAME:-accounting}"
  pool_size: 10
  connection_timeout: 10

logging:
  level: "${LOG_LEVEL:-debug}"
  format: "text" # text or json

cors:
  enabled: true
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
  max_age: 86400

event_store:
  # Event store specific settings
  snapshot_frequency: 100 # Create snapshot every N events

process_managers:
  # Process manager polling settings
  poll_interval_ms: 1000

# Authentication settings
auth:
  # JWT settings (use environment variables for secrets!)
  jwt_secret: ${JWT_SECRET:-CHANGE_THIS_TO_A_SECURE_SECRET_IN_PRODUCTION}
  jwt_expiry_seconds: 3600 # 1 hour
  jwt_issuer: "accounting-api-dev"
  jwt_audience: "accounting-app"

# OAuth2 provider configuration
oauth:
  google:
    client_id: ${GOOGLE_CLIENT_ID:-}
    client_secret: ${GOOGLE_CLIENT_SECRET:-}
    redirect_uri: "${APP_BASE_URL:-http://localhost:5173}/app/auth/oauth/google/callback"
  github:
    client_id: ${GITHUB_CLIENT_ID:-}
    client_secret: ${GITHUB_CLIENT_SECRET:-}
    redirect_uri: "${APP_BASE_URL:-http://localhost:5173}/app/auth/oauth/github/callback"
  microsoft:
    client_id: ${MICROSOFT_CLIENT_ID:-}
    client_secret: ${MICROSOFT_CLIENT_SECRET:-}
    redirect_uri: "${APP_BASE_URL:-http://localhost:5173}/app/auth/oauth/microsoft/callback"
# Telegram bot configuration
telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN:-}
  bot_username: ${TELEGRAM_BOT_USERNAME:-}
  webhook_url: null # Use polling in development
  use_polling: true
  polling_timeout: 30
  auth_max_age_seconds: 86400 # 24 hours

# Exchange rate provider
exchange_rate:
  provider: nbu

# Banking integration
banking:
  enabled: ${BANKING_ENABLED:-false}
  # Base64-encoded 32-byte key used to encrypt persisted bank-connection tokens.
  token_enc_key: "${BANKING_TOKEN_ENC_KEY:-}"
  providers:
    monobank:
      enabled: ${BANKING_MONOBANK_ENABLED:-false}
      api_base_url: "${BANKING_MONOBANK_API_BASE_URL:-https://api.monobank.ua}"
    privatbank:
      enabled: ${BANKING_PRIVATBANK_ENABLED:-false}

# LLM provider (OpenAI-compatible) for natural-language transaction prompting
llm:
  enabled: ${LLM_ENABLED:-false}
  base_url: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  model: ${LLM_MODEL:-llama-3.3-70b-versatile}
  api_key: ${LLM_API_KEY:-}
  timeout_ms: ${LLM_TIMEOUT_MS:-20000}
