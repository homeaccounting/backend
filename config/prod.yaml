# Production Configuration for Accounting Backend
# All sensitive/environment-specific values are injected via ${VAR} substitution.
# Required environment variables MUST be set — no defaults are provided.

environment: prod

server:
  host: "0.0.0.0"
  port: 8080
  api_base_url: "${API_BASE_URL}"

database:
  host: "${DB_HOST}"
  port: "${DB_PORT}"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  database: "${DB_NAME}"
  pool_size: 20
  connection_timeout: 30

logging:
  level: "info"
  format: "json"

cors:
  enabled: false # Use reverse proxy/API gateway for CORS in production
  allowed_origins: []
  allowed_methods: []
  allowed_headers: []

event_store:
  snapshot_frequency: 100

process_managers:
  poll_interval_ms: 1000

# Authentication settings
auth:
  jwt_secret: "${JWT_SECRET}"
  jwt_expiry_seconds: 3600
  jwt_issuer: "accounting-api"
  jwt_audience: "accounting-app"

# OAuth2 provider configuration
oauth:
  google:
    client_id: "${GOOGLE_CLIENT_ID}"
    client_secret: "${GOOGLE_CLIENT_SECRET}"
    redirect_uri: "${API_BASE_URL}/api/auth/oauth/google/callback"
  github:
    client_id: "${GITHUB_CLIENT_ID}"
    client_secret: "${GITHUB_CLIENT_SECRET}"
    redirect_uri: "${API_BASE_URL}/api/auth/oauth/github/callback"
  microsoft:
    client_id: "${MICROSOFT_CLIENT_ID}"
    client_secret: "${MICROSOFT_CLIENT_SECRET}"
    redirect_uri: "${API_BASE_URL}/api/auth/oauth/microsoft/callback"

# Telegram bot configuration
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  bot_username: "${TELEGRAM_BOT_USERNAME}"
  webhook_url: "${API_BASE_URL}/api/telegram/webhook"
  use_polling: false
  polling_timeout: "${TELEGRAM_POLLING_TIMEOUT:-30}"
  auth_max_age_seconds: 86400

# Exchange rate provider
exchange_rate:
  provider: ${EXCHANGE_RATE_PROVIDER:-nbu}

# Banking integration
banking:
  enabled: ${BANKING_ENABLED:-true}
  providers:
    monobank:
      enabled: ${MONOBANK_ENABLED:-true}
      api_base_url: "${MONOBANK_API_BASE_URL:-https://api.monobank.ua}"
