name: accounting
version: 0.1.0.0
synopsis: Accounting system backend with CQRS and Event Sourcing
description: |
  A REST API for an accounting system built with CQRS and Event Sourcing patterns
  using the Eventium library. Implements DDD with clear aggregate boundaries,
  command handlers, projections, and process managers for complex workflows.
license: MIT
author: Developer
maintainer: developer@example.com
category: Finance
stability: experimental

dependencies:
  # Base
  - base >= 4.17 && < 5

  # Eventium (local packages)
  - eventium-core >= 0.2.0 && < 0.3.0
  - eventium-sql-common >= 0.2.0 && < 0.3.0
  - eventium-postgresql >= 0.2.0 && < 0.3.0
  - eventium-memory >= 0.2.0 && < 0.3.0

  # Servant web framework
  - servant >= 0.19 && < 0.21
  - servant-server >= 0.19 && < 0.21
  - warp >= 3.3 && < 3.5
  - http-types >= 0.12 && < 0.13

  # JSON & serialization
  - aeson >= 2.0 && < 2.3
  - aeson-pretty >= 0.8 && < 0.9

  # Database & persistence
  - postgresql-simple >= 0.6 && < 0.8
  - persistent >= 2.13 && < 2.15
  - persistent-postgresql >= 2.13 && < 2.14
  - persistent-template >= 2.12 && < 2.13

  # Core utilities
  - text >= 1.2 && < 2.2
  - bytestring >= 0.10 && < 0.13
  - base64-bytestring >= 1.2 && < 1.3
  - containers >= 0.6 && < 0.8
  - uuid >= 1.3 && < 1.4
  - time >= 1.9 && < 1.15

  # Monad transformers & effects
  - mtl >= 2.2 && < 2.4
  - transformers >= 0.5 && < 0.7
  - monad-logger >= 0.3 && < 0.4
  - rio >= 0.1.22 && < 0.2
  - unliftio >= 0.2 && < 0.3

  # Concurrency
  - stm >= 2.5 && < 2.6

  # Lens
  - lens >= 4.19 && < 5.4

  # Template Haskell & code generation
  - template-haskell >= 2.16 && < 2.22
  - x-sum-type-boilerplate >= 0.1 && < 0.2

  # WAI & middleware
  - wai >= 3.2 && < 3.3
  - wai-cors >= 0.2 && < 0.3
  - wai-extra >= 3.1 && < 3.2

  # Configuration
  - yaml >= 0.11 && < 0.12
  - aeson-yaml >= 1.1 && < 1.2

  # Error handling
  - safe >= 0.3 && < 0.4

  # Authentication & Security
  - cryptonite >= 0.29 && < 0.31
  - memory >= 0.17 && < 0.19
  - http-client >= 0.7 && < 0.8
  - http-client-tls >= 0.3 && < 0.4
  - http-types >= 0.12 && < 0.13

  # Telegram Bot
  - telegram-bot-api >= 7.4 && < 7.5
  - servant-client >= 0.19 && < 0.21

library:
  source-dirs: src
  ghc-options:
    - -Wall
    - -Wcompat
    - -Widentities
    - -Wincomplete-record-updates
    - -Wincomplete-uni-patterns
    - -Wredundant-constraints
    - -Wpartial-fields
    - -fno-warn-orphans

executables:
  accounting:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -Wall
      - -Wcompat
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - accounting

tests:
  accounting-test:
    main: Spec.hs
    source-dirs:
      - test
    ghc-options:
      - -Wall
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - accounting
      - hspec >= 2.10 && < 2.12
      - hspec-discover >= 2.10 && < 2.12
      - HUnit >= 1.6 && < 1.7
      - QuickCheck >= 2.14 && < 2.16
      # HTTP integration testing
      - hspec-wai >= 0.11 && < 0.12
      - hspec-wai-json >= 0.11 && < 0.12
      - eventium-testkit >= 0.2.0 && < 0.3.0
    build-tools:
      - hspec-discover
