name: backend
version: 0.13.0
synopsis: Accounting system backend with CQRS and Event Sourcing
description: |
  A REST API for an accounting system built with CQRS and Event Sourcing patterns
  using the Eventium library. Implements DDD with clear aggregate boundaries,
  command handlers, projections, and process managers for complex workflows.
license: AGPL-3.0-or-later
author: Developer
maintainer: developer@example.com
category: Finance
stability: experimental

# JSON locale files for the Telegram i18n catalog are embedded at compile time
# (see Telegram.I18n / Telegram.I18n.Embed); ship them in the sdist too.
extra-source-files:
  - locales/**/*.json

dependencies:
  # Base
  - base >= 4.17 && < 5

  # Eventium (local packages)
  - eventium-core >= 0.7.1 && < 0.8.0
  - eventium-sql-common >= 0.7.1 && < 0.8.0
  - eventium-postgresql >= 0.7.1 && < 0.8.0
  - eventium-memory >= 0.7.1 && < 0.8.0

  # Servant web framework
  - servant >= 0.19 && < 0.21
  - servant-server >= 0.19 && < 0.21
  - servant-multipart >= 0.12 && < 0.13
  - warp >= 3.3 && < 3.5
  - http-types >= 0.12 && < 0.13

  # JSON & serialization
  - aeson >= 2.0 && < 2.3
  - aeson-pretty >= 0.8 && < 0.9
  - scientific >= 0.3 && < 0.4

  # Database & persistence
  - postgresql-simple >= 0.6 && < 0.8
  - persistent >= 2.13 && < 2.15
  - persistent-postgresql >= 2.13 && < 2.14

  # Core utilities
  - text >= 1.2 && < 2.2
  - bytestring >= 0.10 && < 0.13
  - base64-bytestring >= 1.2 && < 1.3
  - containers >= 0.6 && < 0.8
  - uuid >= 1.3 && < 1.4
  - time >= 1.9 && < 1.15
  # Timezone conversion for statement-file imports (ADR 005). tzdata embeds the
  # IANA database so the conversion is pure and needs no system zoneinfo.
  - tz >= 0.1.3 && < 0.2
  - tzdata >= 0.2 && < 0.3

  # Monad transformers & effects
  - mtl >= 2.2 && < 2.4
  - transformers >= 0.5 && < 0.7
  - monad-logger >= 0.3 && < 0.4
  - rio >= 0.1.22 && < 0.2
  - unliftio >= 0.2 && < 0.3

  # Concurrency
  - stm >= 2.5 && < 2.6
  - async >= 2.2 && < 2.3

  # Data structures
  - unordered-containers >= 0.2 && < 0.3
  - hashable >= 1.4 && < 1.5

  # Optics
  - optics >= 0.4 && < 0.5
  - optics-th >= 0.4 && < 0.5

  # Template Haskell & code generation
  - template-haskell >= 2.16 && < 2.23

  # WAI & middleware
  - wai >= 3.2 && < 3.3
  - wai-cors >= 0.2 && < 0.3
  - wai-extra >= 3.1 && < 3.2

  # Configuration
  - yaml >= 0.11 && < 0.12
  - aeson-yaml >= 1.1 && < 1.2

  # Error handling
  - safe >= 0.3 && < 0.4

  # Authentication & Security
  - cryptonite >= 0.29 && < 0.31
  - memory >= 0.17 && < 0.19
  - http-client >= 0.7 && < 0.8
  - http-client-tls >= 0.3 && < 0.4
  - http-types >= 0.12 && < 0.13
  - xml-conduit >= 1.9 && < 2

  # Telegram Bot
  - telegram-bot-api >= 7.4 && < 7.5
  - servant-client >= 0.19 && < 0.21

  # Observability (structured logging + Prometheus metrics)
  - prometheus-client >= 1.1 && < 1.2
  - prometheus-metrics-ghc >= 1.0 && < 1.1
  - wai-middleware-prometheus >= 1.0 && < 1.1
  - fast-logger >= 3.2 && < 3.3
  - vault >= 0.3 && < 0.4

flags:
  ci:
    description: Enable -Werror for CI builds
    manual: true
    default: false
  monobank:
    description: Compile the Monobank (UA) bank provider
    manual: true
    default: true
  privatbank:
    description: Compile the PrivatBank (UA) bank provider
    manual: true
    default: true
  privatbank-business:
    description: Compile the PrivatBank (UA) business statement-file provider
    manual: true
    default: true

default-extensions:
  - NoFieldSelectors
  - DuplicateRecordFields
  - OverloadedLabels
  - OverloadedRecordDot
  - DataKinds
  - FlexibleInstances
  - MultiParamTypeClasses
  - TypeFamilies
  - UndecidableInstances
  - FlexibleContexts
  - TypeOperators

library:
  source-dirs: src
  ghc-options:
    - -Wall
    - -Wcompat
    - -Widentities
    - -Wincomplete-record-updates
    - -Wredundant-constraints
    - -fno-warn-orphans
  when:
    - condition: flag(ci)
      ghc-options: -Werror
    - condition: flag(monobank)
      cpp-options: -DPROVIDER_MONOBANK
      exposed-modules:
        - Infrastructure.Banking.Monobank
        - Infrastructure.Banking.Monobank.Internal
    - condition: flag(privatbank)
      cpp-options: -DPROVIDER_PRIVATBANK
      exposed-modules:
        - Infrastructure.Banking.PrivatBank
        - Infrastructure.Banking.PrivatBank.Internal
    - condition: flag(privatbank)
      exposed-modules:
        - Infrastructure.Banking.Csv
      dependencies:
        - cassava >= 0.5 && < 0.6
        - vector >= 0.12 && < 0.14
    - condition: flag(privatbank-business)
      cpp-options: -DPROVIDER_PRIVATBANK_BUSINESS
      exposed-modules:
        - Infrastructure.Banking.PrivatBankBusiness
        - Infrastructure.Banking.PrivatBankBusiness.Internal
    - condition: flag(privatbank-business)
      exposed-modules:
        - Infrastructure.Banking.Xlsx
      dependencies:
        - zip-archive >= 0.4 && < 0.5
        - vector >= 0.12 && < 0.14

executables:
  backend:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -Wall
      - -Wcompat
      - -threaded
      - -rtsopts
    when:
      - condition: flag(ci)
        ghc-options: -Werror
    dependencies:
      - backend
    # -with-rtsopts must reach GHC as a single token so BOTH -N (capabilities)
    # and -T (RTS/GC stats for prometheus-metrics-ghc) are embedded — GHC keeps
    # only the last -with-rtsopts, and cabal splits unquoted ghc-options on
    # whitespace. hpack (0.38.3) does not quote list items, so inject the quoted
    # token verbatim as an extra ghc-options field (cabal accumulates them).
    verbatim: |
      ghc-options: "-with-rtsopts=-N -T"

tests:
  backend-test:
    main: Spec.hs
    source-dirs:
      - test
    ghc-options:
      - -Wall
      # Test-only relaxations (lib/exe stay fully strict): test fixtures
      # intentionally use partial head/tail on statically-known-non-empty data,
      # define orphan generator/Arbitrary instances, shadow hspec hooks
      # (before/after), and rely on DuplicateRecordFields type-directed updates.
      - -Wno-x-partial
      - -Wno-orphans
      - -Wno-name-shadowing
      - -Wno-ambiguous-fields
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    when:
      - condition: flag(ci)
        ghc-options: -Werror
    dependencies:
      - backend
      - hspec >= 2.10 && < 2.12
      - hspec-discover >= 2.10 && < 2.12
      - HUnit >= 1.6 && < 1.7
      - QuickCheck >= 2.14 && < 2.16
      # HTTP integration testing
      - hspec-wai >= 0.11 && < 0.12
      - hspec-wai-json >= 0.11 && < 0.12
      - eventium-testkit >= 0.7.1 && < 0.8.0
      # SQLite-backed harness for persistent read-model tests (in-memory DB).
      - eventium-sqlite >= 0.7.1 && < 0.8.0
      - persistent-sqlite >= 2.13 && < 2.15
      - cassava >= 0.5 && < 0.6
      - vector >= 0.12 && < 0.14
      - zip-archive >= 0.4 && < 0.5
    build-tools:
      - hspec-discover
